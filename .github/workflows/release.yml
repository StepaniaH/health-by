name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/checks.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          tag_version = os.environ["TAG"].lstrip("v")
          pyproject_ver = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          init_text = pathlib.Path("health_by/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.M)
          init_ver = m.group(1) if m else ""
          assert tag_version == pyproject_ver == init_ver, (tag_version, pyproject_ver, init_ver)
          PY

      - name: Notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ["TAG"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(version)}\].*?(?=^## |\Z)", text, re.M | re.S)
          if not m:
              m = re.search(r"^## \[Unreleased\].*?(?=^## |\Z)", text, re.M | re.S)
          notes = m.group(0).strip() if m else f"See CHANGELOG.md for {os.environ['TAG']}."
          notes = re.sub(rf"^## \[({re.escape(version)})\]", r"## \1", notes)
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
