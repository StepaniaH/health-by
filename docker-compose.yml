# health-by — Docker Compose
#
# Start:  mkdir -p data && docker compose up -d
# Open:   http://127.0.0.1:39441 — demo data is ready without credentials
# Connect real data: Settings → paste your own Google Cloud OAuth credentials → Connect
#
# Docs: docs/setup-google-health.md (real data), docs/data-coverage.md (API surface)
services:
  health-by:
    # Published image. To build from this checkout instead, replace both lines with:
    #   build: .
    #   image: health-by:local
    image: stepaniah/health-by:latest
    container_name: health-by
    restart: unless-stopped
    environment:
      # Defines "today" and the sync target date.
      - TZ=${TZ:-Asia/Shanghai}
      # Concurrent sync days sharing one outbound rate limiter.
      - HEALTH_BY_SYNC_WORKERS=${HEALTH_BY_SYNC_WORKERS:-}
    ports:
      - "127.0.0.1:39441:39441"
    volumes:
      - ./data:/data                                # SQLite database + encryption key
    user: "1000:1000"                               # your own UID:GID — `id -u`, `id -g`
