# health-by — Docker Compose
#
# 快速开始:  docker compose up -d --build
# 首次访问:  http://127.0.0.1:39441 （演示模式自动就绪，无需配置）
# 连接真实数据: 打开「设置」页，填入自己的 Google Cloud OAuth 凭据后点「连接」
#
# 说明：
#  - 默认只绑定 127.0.0.1（本机回环）。局域网 / Tailscale 私网访问请在
#    ports 里改成对应绑定地址；不要把端口映射到公网。
#  - OAuth 回调地址是 http://127.0.0.1:39441/oauth/callback（浏览器与容器同机时
#    开箱即用；若反向代理到自定义域名，请在设置页把回调地址改成代理后的地址）。
#  - 时区由 environment 的 TZ 控制（默认 Asia/Shanghai）：应用里“今天”的判定、
#    同步的目标日期都按它计算，跨时区部署记得修改。
services:
  health-by:
    build: .
    image: ${HEALTH_BY_IMAGE:-${FITBIT_BY_IMAGE:-health-by:local}}
    container_name: health-by
    restart: unless-stopped
    environment:
      # 时区：决定应用里“今天”的判定与同步目标日期。默认 Asia/Shanghai，按需修改。
      - TZ=${TZ:-Asia/Shanghai}
      # 并发同步天数（共享同一出站限速器，整体仍 <5 req/s）
      - HEALTH_BY_SYNC_WORKERS=${HEALTH_BY_SYNC_WORKERS:-}
      - FITBIT_BY_SYNC_WORKERS=${FITBIT_BY_SYNC_WORKERS:-}
    ports:
      - "127.0.0.1:39441:39441"
    volumes:
      - ./data:/data # SQLite 数据库 + 加密密钥
    # user: "1000:1000"  # 宿主 UID 不是 1000 时取消注释
