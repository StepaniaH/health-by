[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-by"
version = "0.0.3"
description = "Self-hosted fitness data service: sync, store, analyze and display Fitbit / Google Health data. Web + CLI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "StepaniaH" }]
keywords = ["health", "fitbit", "google-health", "self-hosted", "fastapi", "sqlite", "fitness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "click>=8.1",
  "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/StepaniaH/health-by"
Repository = "https://github.com/StepaniaH/health-by"
Issues = "https://github.com/StepaniaH/health-by/issues"
Changelog = "https://github.com/StepaniaH/health-by/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=2.0"]

[project.scripts]
health-by = "health_by.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["health_by"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "browser: real Chromium E2E tests requiring Playwright",
]
