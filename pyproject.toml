[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-by"
version = "0.0.3"
description = "Self-hosted fitness data service: sync, store, analyze and display Fitbit / Google Health data. Web + CLI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "StepaniaH" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "click>=8.1",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
health-by = "health_by.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["health_by"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
